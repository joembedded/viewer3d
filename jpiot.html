<!DOCTYPE html>
<!-- dieses kleine Tool laedt ein GLB Modell -->
<!-- (C)JoEmbedded -->
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181e24" />
    <title>JPIoT Hardware · JoEmbedded-Labs</title>
    <style>
        html { color-scheme: dark; }
        body {
            box-sizing: border-box;
            height: 100vh;
            height: 100dvh;
            margin: 0;
            padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right))
                max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #181e24;
            color: #edf2f5;
            font-family: system-ui, sans-serif;
        }
        .page-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 4px 16px;
            padding: 2px 4px;
        }
        h1 { margin: 0; font-size: clamp(1rem, 2.5vw, 1.25rem); font-weight: 600; }
        .page-header p { margin: 0; color: #aebcc7; font-size: 0.8125rem; }
        #mviewer {
            flex: 1;
            min-height: 160px;
            width: 100%;
            border: 1px solid #647780;
            border-radius: 12px;
            background: #202830;
            box-shadow: 0 3px 12px #0003;
        }
        #mloader {
            max-width: calc(100% - 32px);
            box-sizing: border-box;
            border: 1px solid #647780;
            border-radius: 8px;
            background: #202830;
            font-size: 0.875rem;
            text-align: center;
        }
        @media (max-width: 480px) {
            body { gap: 8px; }
            #mviewer { border-radius: 9px; }
        }
    </style>

    <!-- 3D Magic starts here (Init) -->
    <link rel="stylesheet" href="./jo3dview.css?v=20261011">
    <script type="importmap">
        {
            "imports": {
            "three": "./three/build/three.module.min.js",
            "three/addons/": "./three/examples/jsm/"
            }
        }

    </script>
    <!-- 3D Magic end (Init) -->

</head>

<body>
    <header class="page-header">
        <h1>JoEmbedded-Labs</h1>
        <p>JPIoT Hardware V0.2.1</p>
    </header>
    <main id="mviewer" class="jo3dviewer" aria-label="Interactive 3D view of the JPIoT circuit board">
        <div id="mloader" class="jo3dloader" role="status">Loading...</div>
    </main>
    <!-- 3D Magic starts here (Use) -->
    <script type="module">
        import { view3d } from './jo3dview.js?v=20261011';
        import { ACESFilmicToneMapping } from 'three';
        const d3img2 = view3d('mviewer', './view3d_browser.glb', 1.1, 'mloader','./joembeddedlab.webp');
        // Keep the laboratory subdued while retaining detail in metal and dark parts.
        d3img2.scene.backgroundIntensity = 0.45;
        d3img2.scene.environmentIntensity = 2;
        d3img2.renderer.toneMapping = ACESFilmicToneMapping;
        d3img2.renderer.toneMappingExposure = 1.15;
        d3img2.camera.position.set(-1, 0.5, 2);
        d3img2.controls.autoRotateSpeed = -1;

    </script>
    <!-- 3D Magic end (Use) -->
</body>

</html>
