    <h2>RAK3172 module · responsive view</h2>
    <div id="mviewer" class="jo3dviewer demo-primary" data-flight-recorder="visible">
        <div id="mloader" class="jo3dloader"></div>
    </div>
    <h2>Material sample · compact view</h2>
    <div id="vmini" class="jo3dviewer demo-mini" data-flight-recorder="visible">
        <div id="miniloader" class="jo3dloader"></div>
    </div>
    <!-- 3D Magic starts here (Use) -->
    <script type="module">
        import { view3d } from './driver_js/jo3dview.js';
        // --- Model 1: A **Very** Simple Display, no Background ---
        view3d('mviewer', './models/rak3172sip.glb', 1.2, 'mloader');

        // --- Model 2: With Background: Use Background and change Parameters - from Wikipedia https://de.wikipedia.org/wiki/Datei:Ampleben_Panorama.jpg ---
        const d3img2 = view3d('vmini', './models/testball.glb', 2.5, 'miniloader', './skyboxes/1024px-Ampleben_Panorama.jpg');
        d3img2.scene.backgroundIntensity = 0.5;
        d3img2.renderer.toneMappingExposure = 0.8;
        d3img2.camera.position.set(-1, 0.5, 2);
        d3img2.controls.autoRotateSpeed = -2;
    </script>
    <!-- 3D Magic end (Use) -->
</body>
