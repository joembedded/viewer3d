<body>
    <nav class="page-navigation" aria-label="Seitennavigation">
        <a class="back-link" href="./index.html" lang="de"><span aria-hidden="true">←</span> Zurück</a>
    </nav>
    <header class="page-header">
        <h1>JoEmbedded-Labs</h1>
        <p>JPIoT Hardware V0.2.1</p>
    </header>
    <main id="mviewer" class="jo3dviewer" data-flight-recorder="visible" aria-label="Interactive 3D view of the JPIoT circuit board">
        <div id="mloader" class="jo3dloader" role="status">Loading...</div>
    </main>
    <!-- 3D Magic starts here (Use) -->
    <script type="module">
        import { view3d } from './driver_js/jo3dview.js?v=20261011';
        import { ACESFilmicToneMapping, DirectionalLight, Object3D, PCFSoftShadowMap } from 'three';

        // The PNG supplies reflections and diffuse fill. Its visible background
        // is controlled separately, so dimming the room never dims the PCB.
        const d3img2 = view3d('mviewer', './models/view3d_opt.glb', 1.1, 'mloader',
            './skyboxes/industrial_skybox.mp4', 
            // './skyboxes/industrial_skybox.png', 
            // './skyboxes/joembeddedlab.webp', 
            true, {
                toneMapping: ACESFilmicToneMapping,
                exposure: 1.1,
                environmentIntensity: 1.15,
                backgroundIntensity: 0.12,
                backgroundBlurriness: 0.025,
                autoRotate: !matchMedia('(prefers-reduced-motion: reduce)').matches,
                autoRotateSpeed: -0.5,
                // modelAutoRotateSpeed: [1, -1.5, 0]
            });
        d3img2.camera.position.set(-1, 2, 2);
        d3img2.controls.update();

        // Camera-relative studio lighting also illuminates the underside when
        // orbiting. The LDR panorama alone cannot supply bright studio lights.
        const lightTarget = new Object3D();
        d3img2.scene.add(lightTarget, d3img2.camera);
        function studioLight(intensity, x, y, z) {
            const light = new DirectionalLight(0xffffff, intensity);
            light.position.set(x, y, z);
            light.target = lightTarget;
            d3img2.camera.add(light);
            return light;
        }
        const keyLight = studioLight(1.8, -3, 4, 2);
        const fillLight = studioLight(0.4, 4, 0, 1);
        const rimLight = studioLight(0.8, 1, -3, -4);

        // Small contact shadows separate components from the board surface.
        d3img2.renderer.shadowMap.enabled = true;
        d3img2.renderer.shadowMap.type = PCFSoftShadowMap;
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(2048, 2048);
        Object.assign(keyLight.shadow.camera, {
            left: -1.2, right: 1.2, top: 1.2, bottom: -1.2,
            near: 0.1, far: 20
        });
        keyLight.shadow.camera.updateProjectionMatrix();
        keyLight.shadow.bias = -0.00003;
        keyLight.shadow.normalBias = 0.0005;
        // Called if Model loaded and all ready
        d3img2.ready.then(() => {
            d3img2.model.traverse(object => {
                if (!object.isMesh) return;
                object.castShadow = true;
                object.receiveShadow = true;
            });
            d3img2.invalidate();
        }).catch(() => {}); // The viewer already displays model-loading errors.

        const disposeViewer = d3img2.dispose;
        d3img2.dispose = () => {
            keyLight.dispose();
            fillLight.dispose();
            rimLight.dispose();
            disposeViewer();
        };

    </script>
    <!-- 3D Magic end (Use) -->
</body>

</html>
